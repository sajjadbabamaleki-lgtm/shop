name: TEMP why the enquiry reply was not sent
on:
  push:
    branches: [claude/admin-panel-invoices-products-4lixqt]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @liara/cli@9
      - name: SMS settings on the app (names and non-secret values only)
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $LIARA_TOKEN" \
            "https://api.iran.liara.ir/v1/projects/vikyplus" > p.json || true
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('p.json'))
          except Exception as e:
              print('no json', e); print(open('p.json').read()[:300]); raise SystemExit
          envs = (d.get('project') or d).get('envs') or []
          for e in envs:
              k = e.get('key', '')
              if k.startswith('SMS_'):
                  v = e.get('value', '')
                  shown = v if k in ('SMS_DRIVER',) else ('(set, %d chars)' % len(v) if v else '(EMPTY)')
                  print(k, '=', shown)
          PY
      - name: The log line for the reply
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          (liara logs --app vikyplus --api-token "$LIARA_TOKEN" --since 2d --no-color 2>&1 || true) > logs.txt
          wc -l logs.txt
          grep -n "enquiry\|SMS\|Melipayamak\|sms" logs.txt | tail -40 || true
          tail -5 logs.txt
