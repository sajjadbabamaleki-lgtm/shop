# TEMPORARY — screenshots the home page's «فروشگاه» band at phone widths,
# because this session's container cannot run the app. Deploys nothing.
# Delete before this branch reaches main.
name: zz shot shop band
on:
  push:
    branches: [claude/pensive-brown-fv762w]
    paths: ['.github/workflows/zz-shot-shop-band.yml', '.github/shots/**', 'storefront/resources/views/home/**', 'storefront/resources/views/home.blade.php', 'storefront/public/assets/css/tweaks.css']
permissions:
  contents: read
jobs:
  shot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vikyplus, POSTGRES_PASSWORD: vikyplus, POSTGRES_DB: vikyplus_testing }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    defaults: { run: { working-directory: ./storefront } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql', coverage: none }
      - name: Install
        env: { COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}' }
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Serve
        env: { DB_HOST: 127.0.0.1, DB_PASSWORD: vikyplus, DB_DATABASE: vikyplus_testing, DB_USERNAME: vikyplus }
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force
          (DB_HOST=127.0.0.1 DB_PASSWORD=vikyplus DB_DATABASE=vikyplus_testing DB_USERNAME=vikyplus php artisan serve --port=8812 > /tmp/serve.log 2>&1 &)
          sleep 5; curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8812/
      - name: Shoot
        working-directory: .github/shots
        run: |
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node shoot.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: .github/shots/*.png }
      - if: always()
        run: tail -50 /tmp/serve.log || true
