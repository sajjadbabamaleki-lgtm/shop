name: tmp liara envs
on:
  push:
    branches: [claude/snapppay-production-envs]
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: List env names (values only for non-secret keys)
        env:
          T: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          curl -s -m 30 -H "Authorization: Bearer $T" "https://api.iran.liara.ir/v1/projects/vikyplus" > p.json
          jq -r '(.project.envs // .envs // [])[] | "\(.key|@json) = " + (if (.key|test("^(PAYMENT_|SNAPPPAY_BASE_URL|SNAPPPAY_COMMISSION|TOROBPAY_BASE_URL|APP_URL|APP_ENV)")) then (.value|@json) elif (.key|test("SNAPP|TOROB")) then "<set, \(.value|length) chars>" else "-" end)' p.json | grep -iE "PAYMENT|SNAPP|TOROB|APP_URL|APP_ENV" | while read -r l; do echo "::warning::$l"; done
          jq -r 'keys' p.json | head -5
