# TEMPORARY. Delete once it has answered.
#
# Which products in the shop the two shoes in the client's photographs are, and
# what the shop calls the On brand. Nothing in the container can reach
# vikyplus.ir; only the deploy job is gated on `main`, so this ships nothing.
name: Look up

on:
  push:
    branches: [claude/website-loading-speed-zn0uri]

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet pillow

      - name: The Golden Geese and the On shoes
        run: |
          python3 - <<'PY'
          import io, re, urllib.parse, urllib.request
          from PIL import Image

          HOST = 'https://vikyplus.ir'

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'vikyplus-lookup'})
              return urllib.request.urlopen(req, timeout=60).read()

          def profile(img):
              px = list(img.getdata())
              n = len(px)
              black = white = tan = 0
              for r, g, b in px:
                  if r < 80 and g < 80 and b < 80:
                      black += 1
                  elif r > 195 and g > 195 and b > 195:
                      white += 1
                  elif 120 < r < 215 and 90 < g < 190 and b < 165 and r - b > 30:
                      tan += 1
              return (100 * black / n, 100 * white / n, 100 * tan / n)

          for term in ['گلدن گوس', 'کلادتیلت', 'آن', 'اون', 'On', 'کلاد']:
              html = get(HOST + '/search?q=' + urllib.parse.quote(term)).decode('utf-8', 'replace')
              cards = re.findall(r'<article class="vp-card".*?</article>', html, re.S)
              print(f'== {term}: {len(cards)} cards')
              for block in cards[:20]:
                  href = re.search(r'class="vp-card-name" href="([^"]+)"', block)
                  name = re.search(r'class="vp-card-name"[^>]*>([^<]*)', block)
                  price = re.search(r'class="vp-card-price">([^<]*)', block)
                  shot = re.search(r'class="vp-card-shot[^"]*"[^>]*>\s*<img src="([^"]+)"', block)
                  slug = urllib.parse.unquote(href.group(1).rsplit('/', 1)[-1]) if href else '?'
                  bits = ''
                  if shot:
                      try:
                          img = Image.open(io.BytesIO(get(shot.group(1)))).convert('RGB')
                          img.thumbnail((200, 200))
                          w, h = img.size
                          mid = profile(img.crop((int(w * .2), int(h * .2), int(w * .8), int(h * .8))))
                          bits = '  black {:5.1f}  white {:5.1f}  tan {:5.1f}'.format(*mid)
                      except Exception as exc:
                          bits = f'  (no shot: {exc})'
                  print('  {:>12}  {}{}'.format(
                      (price.group(1).strip() if price else '?'),
                      slug, bits))
          PY
