# TEMPORARY. Delete once it has answered.
#
# The shop has two dozen Air Jordan 1s and the colourway lives only in the
# name, so which one the client's photograph is of cannot be read from a slug.
# Measuring a mean colour has been tried three times and failed three times —
# the supplier's studio ground dominates every average. So this brings the
# pictures back instead: a labelled contact sheet, base64 in the log, decoded
# and looked at.
#
# Nothing in the container can reach vikyplus.ir. Only the deploy job is gated
# on `main`, so this ships nothing.
name: Look up

on:
  push:
    branches: [claude/website-loading-speed-zn0uri]

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet pillow

      - name: Contact sheet of every Jordan the shop sells
        run: |
          python3 - <<'PY'
          import base64, io, re, urllib.parse, urllib.request
          from PIL import Image, ImageDraw

          HOST = 'https://vikyplus.ir'

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'vikyplus-lookup'})
              return urllib.request.urlopen(req, timeout=60).read()

          html = get(HOST + '/search?q=' + urllib.parse.quote('جردن')).decode('utf-8', 'replace')

          items = []
          for m in re.finditer(r'<article class="vp-card".*?</article>', html, re.S):
              block = m.group(0)
              href = re.search(r'class="vp-card-name" href="([^"]+)"', block)
              shot = re.search(r'class="vp-card-shot[^"]*"[^>]*>\s*<img src="([^"]+)"', block)
              if href and shot:
                  slug = urllib.parse.unquote(href.group(1).rsplit('/', 1)[-1])
                  items.append((slug, shot.group(1)))

          print(f'{len(items)} Jordans')
          for i, (slug, _) in enumerate(items):
              print(f'  [{i:02d}] {slug}')

          CELL = 150
          COLS = 6
          rows = (len(items) + COLS - 1) // COLS
          sheet = Image.new('RGB', (COLS * CELL, rows * (CELL + 18)), 'white')
          draw = ImageDraw.Draw(sheet)

          for i, (slug, src) in enumerate(items):
              try:
                  shot = Image.open(io.BytesIO(get(src))).convert('RGB')
              except Exception as exc:
                  print(f'  [{i:02d}] could not fetch: {exc}')
                  continue
              shot.thumbnail((CELL, CELL))
              x = (i % COLS) * CELL
              y = (i // COLS) * (CELL + 18)
              sheet.paste(shot, (x + (CELL - shot.width) // 2, y + (CELL - shot.height) // 2))
              draw.text((x + 4, y + CELL + 3), f'{i:02d}', fill='black')

          out = io.BytesIO()
          sheet.save(out, 'PNG', optimize=True)
          blob = base64.b64encode(out.getvalue()).decode()
          print(f'SHEET {sheet.width}x{sheet.height} {len(blob)} bytes of base64')
          for i in range(0, len(blob), 400):
              print('B64 ' + blob[i:i + 400])
          PY
