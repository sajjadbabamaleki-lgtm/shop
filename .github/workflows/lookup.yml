# TEMPORARY. Delete once it has answered.
#
# Which of the shop's two dozen Air Jordan 1s the client's photograph is of.
# The colourway lives only in the name, and nothing in the container can reach
# vikyplus.ir. Only the deploy job is gated on `main`, so this ships nothing.
#
# **Measuring a mean colour failed three times before and this is not that.**
# A mean is dominated by the supplier's studio ground, which is a light
# gradient and nearly the same in every shot. What is measured here instead is
# the *fraction of pixels that are strongly red* and *strongly black* — the
# ground contributes nothing to either, so it dilutes both equally and cannot
# reorder the ranking. The client's cut-out, measured the same way over its
# own alpha, is 40.2% red, 43.8% white, 10.8% black.
name: Look up

on:
  push:
    branches: [claude/website-loading-speed-zn0uri]

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet pillow

      - name: How red is each Jordan
        run: |
          python3 - <<'PY'
          import io, re, urllib.parse, urllib.request
          from PIL import Image

          HOST = 'https://vikyplus.ir'

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'vikyplus-lookup'})
              return urllib.request.urlopen(req, timeout=60).read()

          html = get(HOST + '/search?q=' + urllib.parse.quote('جردن')).decode('utf-8', 'replace')

          items = []
          for m in re.finditer(r'<article class="vp-card".*?</article>', html, re.S):
              block = m.group(0)
              href = re.search(r'class="vp-card-name" href="([^"]+)"', block)
              shot = re.search(r'class="vp-card-shot[^"]*"[^>]*>\s*<img src="([^"]+)"', block)
              if href and shot:
                  items.append((urllib.parse.unquote(href.group(1).rsplit('/', 1)[-1]), shot.group(1)))

          def profile(img):
              px = list(img.getdata())
              n = len(px)
              red = white = black = 0
              for r, g, b in px:
                  if r > 110 and r - g > 50 and r - b > 50:
                      red += 1
                  elif r > 195 and g > 195 and b > 195:
                      white += 1
                  elif r < 80 and g < 80 and b < 80:
                      black += 1
              return (100 * red / n, 100 * white / n, 100 * black / n)

          rows = []
          for slug, src in items:
              try:
                  img = Image.open(io.BytesIO(get(src))).convert('RGB')
              except Exception as exc:
                  print(f'  could not fetch {slug}: {exc}')
                  continue
              img.thumbnail((240, 240))
              w, h = img.size
              # The whole frame, and the middle of it, where the shoe is and
              # the ground mostly is not.
              whole = profile(img)
              middle = profile(img.crop((int(w * .2), int(h * .2), int(w * .8), int(h * .8))))
              rows.append((middle[0], whole, middle, slug))

          rows.sort(reverse=True)
          print('   red%  white% black%  |   red%  white% black%   (whole frame | middle 60%)')
          for _, whole, middle, slug in rows:
              print('  {:5.1f} {:6.1f} {:6.1f}  | {:5.1f} {:6.1f} {:6.1f}   {}'.format(
                  whole[0], whole[1], whole[2], middle[0], middle[1], middle[2], slug))
          PY
