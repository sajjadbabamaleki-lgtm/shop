# TEMPORARY. Delete once it has answered.
#
# Nothing in the container can reach vikyplus.ir — the agent proxy answers 403
# for it and for the Liara address — so a question whose answer is only on the
# live shop has to be asked from a runner. Only the deploy job is gated on
# `main`, so this ships nothing.
#
# What it is asking: which product in the shop is the Chicago Air Jordan the
# client sent, and which of the best-seller tiles is the redundant New Balance.
name: Look up

on:
  push:
    branches: [claude/website-loading-speed-zn0uri]

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the shop
        run: |
          set -u
          host=vikyplus.ir

          say () { echo "$@" >> "$GITHUB_STEP_SUMMARY"; }

          # Every product card on a page: its href, its name and its price.
          cards () {
            python3 - "$1" <<'PY'
          import re, sys, urllib.request, gzip, io
          url = sys.argv[1]
          req = urllib.request.Request(url, headers={'User-Agent': 'vikyplus-lookup'})
          raw = urllib.request.urlopen(req, timeout=60).read()
          html = raw.decode('utf-8', 'replace')
          seen = []
          for m in re.finditer(r'<article class="vp-card".*?</article>', html, re.S):
              block = m.group(0)
              href = re.search(r'class="vp-card-name" href="([^"]+)"', block)
              name = re.search(r'class="vp-card-name"[^>]*>([^<]*)', block)
              price = re.search(r'class="vp-card-price">([^<]*)', block)
              seen.append((
                  (href.group(1) if href else '?'),
                  (name.group(1).strip() if name else '?'),
                  (price.group(1).strip() if price else '?'),
              ))
          print(f'{len(seen)} cards')
          for href, name, price in seen:
              print(f'  {name}  |  {price}  |  {href}')
          PY
          }

          say '## Search: جردن'
          say '```'
          cards "https://$host/search?q=%D8%AC%D8%B1%D8%AF%D9%86" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say '```'

          say '## Search: نیوبالانس'
          say '```'
          cards "https://$host/search?q=%D9%86%DB%8C%D9%88%D8%A8%D8%A7%D9%84%D8%A7%D9%86%D8%B3" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say '```'

          say '## Search: شیکاگو'
          say '```'
          cards "https://$host/search?q=%D8%B4%DB%8C%DA%A9%D8%A7%DA%AF%D9%88" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say '```'

          say '## The best-sellers row as the site draws it now'
          say '```'
          python3 - "https://$host/" <<'PY' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          import re, sys, urllib.request
          req = urllib.request.Request(sys.argv[1], headers={'User-Agent': 'vikyplus-lookup'})
          html = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
          i = html.find('vp-best-row')
          seg = html[i:i + 40000]
          shots = re.findall(r'class="vp-best-shot" href="([^"]+)"', seg)
          names = re.findall(r'class="vp-best-name">([^<]*)', seg)
          prices = re.findall(r'class="vp-best-cta"><strong>([^<]*)', seg)
          imgs = re.findall(r'class="vp-best-shot"[^>]*>\s*<img src="([^"]+)"', seg)
          for row in zip(shots, names, prices):
              print('  ' + '  |  '.join(x.strip() for x in row))
          print('  photographs:')
          for src in imgs:
              print('    ' + src)
          PY
          say '```'

          say '## The hero deck as the site draws it now'
          say '```'
          python3 - "https://$host/" <<'PY' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          import re, sys, urllib.request
          req = urllib.request.Request(sys.argv[1], headers={'User-Agent': 'vikyplus-lookup'})
          html = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
          i = html.find('heroSlide6')
          seg = html[i:i + 40000]
          for src in dict.fromkeys(re.findall(r'<img src="([^"]*hero[^"]*)"', seg)):
              print('  ' + src)
          for href in dict.fromkeys(re.findall(r'href="([^"]*/products/[^"]+)"', seg)):
              print('  ' + href)
          PY
          say '```'
