# Temporary: can a GitHub runner reach every host the SnappPay test walks through?
# Delete after reading.
name: tmp reach probe
on:
  push:
    branches: [claude/bot-shop-error-wxric8]
    paths: [.github/workflows/tmp-reach-probe.yml]
jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in https://vikyplus.ir/ https://vikyplus.ir/products/vp-test-item-a https://vikyplus.ir/products/vp-test-item-b https://vikyplus.ir/admin/login https://sandbox.banktest.ir/ https://whatisip.snapppay.ir/whatis/ip https://api.snapppay.ir/; do
            printf '%-55s ' "$u"
            curl -sS -o /dev/null --max-time 20 -w '%{http_code} dns=%{time_namelookup} tcp=%{time_connect} total=%{time_total}\n' "$u" 2>&1 | tail -1
          done
          echo "runner ip: $(curl -sS --max-time 10 https://api.ipify.org)"
