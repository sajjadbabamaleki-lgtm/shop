name: tmp live shot
on:
  push:
    branches: [claude/admin-panel-invoices-products-4lixqt]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
        working-directory: .github/tmp
      - run: mkdir -p shots && node .github/tmp/shot.js
        env:
          NODE_PATH: .github/tmp/node_modules
      - run: |
          git config user.name "shot bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin tmp-live-shots || true
          git checkout --orphan tmp-live-shots
          git rm -rfq --cached . ; git add shots/*.png
          git commit -qm "live shots" && git push -f origin tmp-live-shots
