name: tmp sms why
on:
  push:
    branches: [claude/optimistic-edison-f7g6sb]
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Read the live SMS settings (names, driver, shapes only) and ask Melipayamak which door the key opens
        env:
          T: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          H="Authorization: Bearer $T"
          curl -s -m 30 -H "$H" "https://api.iran.liara.ir/v1/projects/vikyplus" > p.json
          echo "::warning title=keys::$(jq -r '[.project.envs[]?.key | "'"+.+"'"] | join(" ")' p.json)"
          v() { jq -r --arg k "$1" '[.project.envs[]? | select(.key==$k or .key==($k+" ")) | .value][0] // ""' p.json; }
          echo "::warning title=driver::'$(v SMS_DRIVER)'"
          for k in SMS_USER SMS_KEY SMS_FROM SMS_PATTERN SMS_PATTERN_ALERT SMS_PATTERN_REPLY SMS_ALERT_TO; do
            x="$(v $k)"; echo "::warning title=$k::len=${#x} digitsOnly=$([[ "$x" =~ ^[0-9]+$ ]] && echo y || echo n) hasSpace=$([[ "$x" =~ [[:space:]] ]] && echo y || echo n)"
          done
          U="$(v SMS_USER)"; K="$(v SMS_KEY)"
          r=$(curl -s -m 30 -d "username=$U" --data-urlencode "password=$K" https://rest.payamak-panel.com/api/SendSMS/GetCredit | head -c 400)
          echo "::warning title=panel GetCredit (user+key)::$r"
          r=$(curl -s -m 30 "https://rest.payamak-panel.com/api/SendSMS/GetCredit?username=$U&password=$K" -X POST | head -c 400)
          echo "::warning title=panel GetCredit query::$r"
          r=$(curl -s -m 30 -w ' HTTP%{http_code}' "https://console.melipayamak.com/api/receive/credit/$K" | head -c 400)
          echo "::warning title=console credit (key)::$r"
          r=$(curl -s -m 30 -w ' HTTP%{http_code}' "http://api.payamak-panel.com/post/Send.asmx/GetCredit?username=$U&password=$K" | head -c 400)
          echo "::warning title=asmx GetCredit::$r"
          since=$(date -u -d '-3 days' +%Y-%m-%dT%H:%M:%SZ)
          for u in "https://api.iran.liara.ir/v2/projects/vikyplus/logs?since=$(date -d '-3 days' +%s)" "https://api.iran.liara.ir/v1/projects/vikyplus/logs?since=$(date -d '-3 days' +%s)"; do
            curl -s -m 60 -H "$H" "$u" > l.json; echo "::warning title=logs size $u::$(wc -c < l.json) $(head -c 200 l.json | tr -d '\n')"
            grep -oiE '[^"]{0,40}(melipayamak|SMS)[^"]{0,260}' l.json | sed -E 's/09[0-9]{5}/09xxxxx/g' | sort | uniq -c | sort -rn | head -15 | while read -r line; do echo "::warning title=log::$(echo "$line" | sed 's/%/%25/g')"; done
          done
