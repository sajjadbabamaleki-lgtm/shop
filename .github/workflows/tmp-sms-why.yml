name: tmp sms why
on:
  push:
    branches: [claude/optimistic-edison-f7g6sb]
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Read the live SMS settings (names, driver, shapes only) and ask Melipayamak which door the key opens
        env:
          T: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          H="Authorization: Bearer $T"
          curl -s -m 30 -H "$H" "https://api.iran.liara.ir/v1/projects/vikyplus" > p.json
          echo "::warning title=keys::$(jq -r '[.project.envs[]?.key | "'"+.+"'"] | join(" ")' p.json)"
          v() { jq -r --arg k "$1" '[.project.envs[]? | select(.key==$k or .key==($k+" ")) | .value][0] // ""' p.json; }
          echo "::warning title=driver::'$(v SMS_DRIVER)'"
          for k in SMS_USER SMS_KEY SMS_FROM SMS_PATTERN SMS_PATTERN_ALERT SMS_PATTERN_REPLY SMS_ALERT_TO; do
            x="$(v $k)"; echo "::warning title=$k::len=${#x} digitsOnly=$([[ "$x" =~ ^[0-9]+$ ]] && echo y || echo n) hasSpace=$([[ "$x" =~ [[:space:]] ]] && echo y || echo n)"
          done
          U="$(v SMS_USER)"; K="$(v SMS_KEY)"
          echo "::warning title=keys::$(jq -r '[.project.envs[]?.key | "[" + . + "]"] | join(" ")' p.json)"
          echo "::warning title=log::LOG_CHANNEL=[$(v LOG_CHANNEL)] LOG_LEVEL=[$(v LOG_LEVEL)]"
          now=$(date +%s); st=$((now-5*86400))
          for q in "start=$st&end=$now" "start=$st" "from=$st" "since=$((st*1000))" "start=$((st*1000))"; do
            u="https://api.iran.liara.ir/v2/projects/vikyplus/logs?$q"
            curl -s -m 90 -H "$H" "$u" > l.json
            echo "::warning title=logs $q::$(wc -c < l.json) $(head -c 160 l.json | tr -d '\n')"
            if [ $(wc -c < l.json) -gt 2000 ]; then
              grep -oiE '[^"]{0,60}(melipayamak|SMS|پیامک)[^"]{0,300}' l.json | sed -E 's/09[0-9]{5}/09xxxxx/g' | sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][0-9:.]+//g' | sort | uniq -c | sort -rn | head -20 | while read -r line; do echo "::warning title=log::$(echo "$line" | sed 's/%/%25/g' | cut -c1-500)"; done
              break
            fi
          done
