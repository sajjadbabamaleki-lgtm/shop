name: Read the Torob docs

# TEMPORARY. Delete this file once the answer is in hand.
#
# The panel is a JavaScript app; rendering it turned up the specification's own
# source, a markdown file it fetches. This pulls that file whole.

on:
  workflow_dispatch:
  push:
    branches: [claude/website-loading-speed-zn0uri]

permissions:
  contents: read

jobs:
  read:
    name: Fetch the specification
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the markdown the panel renders
        run: |
          for u in \
            "https://panel.torob.com/s/assets/TorobAPI_v3-DrkI35Pg.md" ; do
            echo "=================== $u"
            curl -sSL --max-time 60 "$u" -o spec.md
            wc -c spec.md
            # The log is read from its tail, so print the opening on its own.
            head -n 150 spec.md
          done
