name: Read the Torob docs

# TEMPORARY. Delete this file once the answer is in hand.

on:
  workflow_dispatch:
  push:
    branches: [claude/website-loading-speed-zn0uri]

permissions:
  contents: read

jobs:
  read:
    name: Fetch the token guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install a browser
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Find the markdown behind the token guide, then print it
        run: |
          cat > read.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage();
          const md = [];
          p.on('response', (r) => { if (/\.md(\?|$)/.test(r.url())) md.push(r.url()); });
          await p.goto('https://panel.torob.com/s/torob_api_token_guide', { waitUntil: 'networkidle', timeout: 90000 });
          await p.waitForTimeout(5000);
          console.log('MDURL ' + md.join(' '));
          await b.close();
          JS
          node read.mjs | tee found.txt
          u=$(grep -o 'https://[^ ]*\.md' found.txt | head -1)
          echo "=== $u"
          curl -sSL --max-time 60 "$u" -o guide.md
          wc -c guide.md
          head -n 120 guide.md
