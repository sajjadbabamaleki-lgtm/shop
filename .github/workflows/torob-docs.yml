name: Read the Torob docs

# TEMPORARY. Delete this file once the answer is in hand.
#
# This container's egress proxy refuses panel.torob.com, and WebFetch with it,
# so the only way to read the specification the shop has been asked to
# implement is from a runner. Only the deploy job is gated on `main`, so a
# working branch runs everything and ships nothing — the same tool the
# supplier-photograph question was settled with.

on:
  workflow_dispatch:
  push:
    branches: [claude/website-loading-speed-zn0uri]

permissions:
  contents: read

jobs:
  read:
    name: Fetch the specification
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          set -x
          for u in \
            "https://panel.torob.com/s/torobApiV3" \
            "https://panel.torob.com/api/v3/docs" \
            "https://panel.torob.com/s/torobApiV3/" ; do
            echo "=============== $u"
            curl -sSL --max-time 40 -D - -o body.html "$u" || true
            wc -c body.html || true
            echo "--------------- text"
            python3 - <<'PY' || true
          import html, re
          try:
              raw = open('body.html', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              raise SystemExit
          raw = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', raw)
          text = html.unescape(re.sub(r'(?s)<[^>]+>', ' ', raw))
          text = re.sub(r'[ \t]+', ' ', text)
          text = re.sub(r'\n\s*\n+', '\n', text)
          print(text[:40000])
          PY
          done
