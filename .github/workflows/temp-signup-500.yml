name: TEMP why sign-up answers 500
on:
  push:
    branches: [claude/admin-panel-invoices-products-4lixqt]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @liara/cli@9
      - run: liara logs --help || true
      - name: Errors in the app log
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          (timeout 60 liara logs --app vikyplus --api-token "$LIARA_TOKEN" --since 172800 2>&1 || true) > logs.txt
          wc -l logs.txt
          grep -n "ERROR\|Exception\|SQLSTATE\|account" logs.txt | grep -v "sitemap" | tail -60 || true
          tail -15 logs.txt
      - name: Read the Laravel log file itself
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $LIARA_TOKEN" "https://api.iran.liara.ir/v1/projects/vikyplus" | python3 -c "import json,sys;d=json.load(sys.stdin);e=(d.get('project') or d).get('envs') or [];print([x['key'] for x in e])"
