# TEMPORARY — records SnappPay's merchant test on the live site at desktop size.
# Deploys nothing. It talks to the session that started it through files on
# this branch: it pushes clips and screenshots to .github/snapp/out/ and waits
# for answers in .github/snapp/control/. Delete before this branch reaches main.
name: zz snapp test
on:
  push:
    branches: [claude/pensive-brown-fv762w]
    paths: ['.github/snapp/run.js', '.github/workflows/zz-snapp-test.yml']
permissions:
  contents: write
concurrency: { group: zz-snapp-test, cancel-in-progress: true }
jobs:
  record:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb ffmpeg fonts-vazirmatn >/dev/null || sudo apt-get install -y -qq xvfb ffmpeg >/dev/null
          cd .github/snapp && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Record
        env:
          BRANCH: claude/pensive-brown-fv762w
        run: |
          git config user.name "snapp-test-recorder"
          git config user.email "actions@users.noreply.github.com"
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          sleep 2
          mkdir -p /tmp/seg
          DISPLAY=:99 ffmpeg -v error -f x11grab -video_size 1440x900 -framerate 15 -i :99 -c:v libx264 -preset ultrafast -crf 30 -pix_fmt yuv420p -f segment -segment_time 4 -reset_timestamps 1 /tmp/seg/s%04d.mp4 &
          echo $! > /tmp/ffmpeg.pid
          cd .github/snapp && DISPLAY=:99 node run.js
