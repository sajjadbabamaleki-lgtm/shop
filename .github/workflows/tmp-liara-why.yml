name: tmp liara why
on:
  push:
    branches: [claude/admin-panel-invoices-products-4lixqt]
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Liara about the last releases
        env:
          T: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          H="Authorization: Bearer $T"
          for u in \
            "https://api.iran.liara.ir/v1/projects/vikyplus" \
            "https://api.iran.liara.ir/v2/projects/vikyplus/releases?page=1&count=3" \
            "https://api.iran.liara.ir/v1/projects/vikyplus/releases?page=1&count=3"; do
            body=$(curl -s -m 30 -H "$H" "$u" | tr -d '\r' | tr '\n' ' ' | cut -c1-3000)
            echo "::warning title=$(echo $u | sed 's/.*vikyplus//')::$(echo "$body" | sed 's/%/%25/g' | sed 's/"plan[^,]*,//g' | cut -c1-2500)"
          done
          rid=$(curl -s -m 30 -H "$H" "https://api.iran.liara.ir/v2/projects/vikyplus/releases?page=1&count=1" | jq -r '.releases[0]._id // empty')
          echo "::warning title=rid::$rid"
          if [ -n "$rid" ]; then
            for u in "https://api.iran.liara.ir/v2/releases/$rid/build-logs" "https://api.iran.liara.ir/v2/projects/vikyplus/releases/$rid"; do
              body=$(curl -s -m 30 -H "$H" "$u" | tr -d '\r' | tr '\n' ' ' | tail -c 3000)
              echo "::warning title=$(echo $u | sed 's/.*v2//')::$(echo "$body" | sed 's/%/%25/g')"
            done
          fi
