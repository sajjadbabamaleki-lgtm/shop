name: TEMP is SnappPay connected
on:
  push:
    branches: [claude/bot-shop-error-wxric8]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install -g @liara/cli@9
      - name: Which variables the app holds (names only, never values)
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $LIARA_TOKEN" \
            "https://api.iran.liara.ir/v1/projects/vikyplus" \
          | python3 -c "import json,sys;d=json.load(sys.stdin);e=(d.get('project') or d).get('envs') or [];print('\n'.join(sorted(x['key'] for x in e)))"
      - name: Ask the live container what the gateways answer
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          timeout 240 liara shell --app vikyplus --api-token "$LIARA_TOKEN" \
            --command "php artisan payment:test" 2>&1 | tail -70 || true
