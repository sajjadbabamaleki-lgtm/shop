name: TEMP why is the site down
# Temporary. Delete once it has answered.
on:
  workflow_dispatch:
  push:
    branches: [claude/funny-lovelace-lb204u]
permissions:
  contents: read
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Probe hosts, short timeouts
        run: |
          for h in https://vikyplus.ir https://vikyplus.liara.run https://liara.ir https://console.liara.ir https://api.iran.liara.ir; do
            echo "$h  $(curl -s -o /tmp/b -m 20 --connect-timeout 10 -w 'http=%{http_code} ip=%{remote_ip} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}' "$h/" ; echo " rc=$?")  $(head -c 200 /tmp/b 2>/dev/null | tr '\n' ' ')"
          done
          echo "--- verbose vikyplus.liara.run"
          curl -sv -o /dev/null -m 25 https://vikyplus.liara.run/ 2>&1 | grep -E '^\*|^< HTTP|^< server|^< date' | head -20 || true
          echo "--- tcp 443/80 to 62.60.220.6"
          timeout 10 bash -c '</dev/tcp/62.60.220.6/443' && echo 443 open || echo 443 closed/timeout
          timeout 10 bash -c '</dev/tcp/62.60.220.6/80' && echo 80 open || echo 80 closed/timeout
      - name: Ask Liara
        env:
          T: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          H="Authorization: Bearer $T"
          A=https://api.iran.liara.ir
          curl -s -m 30 -H "$H" "$A/v1/projects/vikyplus" | jq -c 'del(.project.envs)' | cut -c1-2500 || true
          echo "--- releases"
          curl -s -m 30 -H "$H" "$A/v2/projects/vikyplus/releases?page=1&count=3" | jq -c '.releases[]? | {state, createdAt, finishedAt}' || true
          echo "--- databases"
          curl -s -m 30 -H "$H" "$A/v1/databases" | jq -c '.databases[]? | {hostname, status, type, scale}' || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: App log, last 12 hours
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm install -g @liara/cli@9 >/dev/null 2>&1
          (timeout 60 liara logs --app vikyplus --api-token "$LIARA_TOKEN" --since 43200 2>&1 || true) > logs.txt
          wc -l logs.txt
          grep -n "ERROR\|Exception\|SQLSTATE\|fatal\|Fatal\|Killed\|OOM\|exited\|refused\|memory" logs.txt | grep -v sitemap | tail -40 || true
          echo "--- tail"; tail -30 logs.txt
