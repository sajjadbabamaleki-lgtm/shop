name: What the live shop actually holds

# ⛔ TEMPORARY. Delete this file and .github/scripts/read-live-catalogue.py
# once the catalogue has been read.
#
# This container's egress proxy refuses vikyplus.ir and vikyplus.liara.run, so
# nothing run from a session can see the live catalogue — and the seeded copy
# in the repository is five sneakers, which is not what the shop holds. The
# client asked for the products to be sorted into «کالج», «مجلسی» and «صندل»,
# which cannot be done without knowing what the products are.
#
# A runner can reach the site — that is how the `probe` job in
# deploy-liara.yml works — so this walks the public listing and prints the
# address and the full name of every product on it. It reads; it writes
# nothing, deploys nothing, and touches no branch.
#
# It runs on push like everything else here. Only the deploy job in the other
# workflow is gated on `main`, so pushing this to a working branch ships
# nothing.

on:
  push:
  workflow_dispatch:

jobs:
  catalogue:
    name: Read the live catalogue
    runs-on: ubuntu-latest
    # A listing that cannot be fetched must not fail anybody's push.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Walk the shop's pages and print what is on them
        run: |
          : > /tmp/all.tsv

          # The listing paginates, so follow it until a page offers nothing.
          # 15 is a ceiling, not an expectation: an unbounded loop against
          # somebody's live site is not a thing to write into CI.
          for page in $(seq 1 15); do
            body="$(curl -sS -m 60 --compressed "https://vikyplus.ir/products?page=${page}" || true)"

            if [ -z "$body" ]; then
              echo "page ${page}: nothing came back"
              break
            fi

            names="$(printf '%s' "$body" | python3 .github/scripts/read-live-catalogue.py)"

            if [ -z "$names" ]; then
              echo "page ${page}: no product cards on it — stopping"
              break
            fi

            echo "──────── page ${page} ────────"
            printf '%s\n' "$names"
            printf '%s\n' "$names" >> /tmp/all.tsv
          done

          echo
          echo "──────── every product, de-duplicated ────────"
          sort -u /tmp/all.tsv | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          echo "total: $(sort -u /tmp/all.tsv | wc -l)"

      - name: The vocabulary the names are written in
        run: |
          echo "──────── first word ────────"
          cut -f2 /tmp/all.tsv | sort -u | awk '{print $1}' | sort | uniq -c | sort -rn
          echo
          echo "──────── first two words ────────"
          cut -f2 /tmp/all.tsv | sort -u | awk '{print $1, $2}' | sort | uniq -c | sort -rn
          echo
          echo "──────── anything that is none of the four ────────"
          cut -f2 /tmp/all.tsv | sort -u \
            | grep -v '^کتونی' | grep -v '^ونس' | grep -v '^صندل' | grep -v '^کالج' \
            || echo "(none)"

      - name: And how many each category already holds
        run: |
          for slug in majlesi sneaker college sandal boot bag-set accessory sport-set; do
            body="$(curl -sS -m 60 --compressed "https://vikyplus.ir/categories/${slug}" || true)"
            count="$(printf '%s' "$body" | grep -c 'class="vp-card-name"' || true)"
            echo "${slug}: ${count} card(s) on page 1"
          done
