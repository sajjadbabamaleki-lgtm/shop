name: Tests and deploy

# Runs the test suite on every push and every pull request, and deploys to
# Liara from `main` and from nowhere else.
#
# The app lives in storefront/, not at the repository root, which is why every
# step below sets working-directory. Liara's own documentation deploys from the
# root; this is the same thing pointed one level down.
#
# ──────────────────────────────────────────────────────────────────────────
# ⛔ WHY THERE IS NO LIST OF DEPLOY BRANCHES ANY MORE
#
# There used to be one, and it had four names on it. **Every name on that list
# deployed its own tree to the same Liara app, and the deploy has no merge
# step**, so the live site was never a combination of two branches — it was
# whichever one pushed last, whole. Two sessions worked in parallel on
# 2026-08-15, and the second one's three pushes silently replaced the first
# one's work on the live site while losing nothing in git:
#
#     #214  07:12  shop-search-filter-height   its work live
#     #215  08:59  shoe-store-ui-review        that work gone from the site
#
# The client found it on their phone — «چرا موارد برمیگرده به نسخه قبل؟» —
# hours later, because nothing anywhere went red.
#
# So: **one deploy branch, and it is `main`.** A push to any other branch still
# runs the whole suite, which is the signal a working branch needs; it just
# does not go live. To ship, bring `main` up to the branch and push `main`.
# The guard in the deploy job is the second belt — see it for the race this
# still leaves.
#
# The same rule, written for whoever reads the repository rather than this
# file, is at the top of CLAUDE.md.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The catalogue's invariants — stock never negative, a reservation never
    # above what is on hand, a sale price never above the struck-through one —
    # are CHECK constraints in PostgreSQL DDL, so the suite needs the real
    # database rather than SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vikyplus
          POSTGRES_PASSWORD: vikyplus
          POSTGRES_DB: vikyplus_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./storefront

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # intl because prices are formatted through ICU; pdo_pgsql for the
          # catalogue. Both are what the app declares in composer.json.
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: vikyplus
        run: php artisan test

      - name: Check the code style
        run: ./vendor/bin/pint --test

  deploy:
    name: Deploy to Liara
    runs-on: ubuntu-latest
    needs: tests
    # `main` and nothing else. Never a pull request, and never a working branch
    # — including through the "Run workflow" button, which can be pointed at
    # any ref and would otherwise put that ref's whole tree live.
    #
    # A push to a working branch still reaches the job above it, so the branch
    # gets its tests. It just does not become the site.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # The race the branch rule alone does not close.
      #
      # Two sessions can both bring `main` up and push within a minute of each
      # other. Both runs queue. If the older one reaches this step last it
      # deploys the older tree over the newer one, and the newer session's work
      # disappears from the site exactly as it did on 2026-08-15 — same
      # symptom, different cause, and just as silent.
      #
      # **Only the current tip of `main` may be deployed.** Ancestry is not the
      # test and getting that wrong would leave the hole open: a superseded
      # commit is still an ancestor of the branch that moved past it, so an
      # `--is-ancestor` check would wave it through and let it overwrite the
      # newer site. It has to be the tip, exactly.
      #
      # A superseded run goes red. That is deliberate and it is not noise: red
      # here means "this build did not go live", which is true, and the newer
      # run is meanwhile putting the newer tree up. A green job that quietly
      # deployed nothing is the failure this whole file is trying to stop.
      - name: Refuse to deploy a tree that main has moved past
        run: |
          git fetch --no-tags --depth=1 --quiet origin main
          here="$(git rev-parse HEAD)"
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$here" != "$tip" ]; then
            echo "::error::main has moved on (this run is ${here}, main is now ${tip}). Deploying this tree would put an older site live over a newer one, so nothing was deployed. The run for ${tip} is the one that ships; this failure is expected when two pushes land together."
            exit 1
          fi


      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Liara CLI
        run: npm install -g @liara/cli@9

      - name: Deploy
        working-directory: ./storefront
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        # The app's name in the Liara panel. Set a repository variable named
        # LIARA_APP to use a different one; otherwise it is "vikyplus".
        run: |
          liara deploy \
            --app "${{ vars.LIARA_APP || 'vikyplus' }}" \
            --api-token "$LIARA_TOKEN" \
            --no-app-logs
