name: Tests and deploy

# Runs the test suite on every push and every pull request, and deploys to
# Liara from `main` and from nowhere else.
#
# The app lives in storefront/, not at the repository root, which is why every
# step below sets working-directory. Liara's own documentation deploys from the
# root; this is the same thing pointed one level down.
#
# ──────────────────────────────────────────────────────────────────────────
# ⛔ WHY THERE IS NO LIST OF DEPLOY BRANCHES ANY MORE
#
# There used to be one, and it had four names on it. **Every name on that list
# deployed its own tree to the same Liara app, and the deploy has no merge
# step**, so the live site was never a combination of two branches — it was
# whichever one pushed last, whole. Two sessions worked in parallel on
# 2026-08-15, and the second one's three pushes silently replaced the first
# one's work on the live site while losing nothing in git:
#
#     #214  07:12  shop-search-filter-height   its work live
#     #215  08:59  shoe-store-ui-review        that work gone from the site
#
# The client found it on their phone — «چرا موارد برمیگرده به نسخه قبل؟» —
# hours later, because nothing anywhere went red.
#
# So: **one deploy branch, and it is `main`.** A push to any other branch still
# runs the whole suite, which is the signal a working branch needs; it just
# does not go live. To ship, bring `main` up to the branch and push `main`.
# The guard in the deploy job is the second belt — see it for the race this
# still leaves.
#
# The same rule, written for whoever reads the repository rather than this
# file, is at the top of CLAUDE.md.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The catalogue's invariants — stock never negative, a reservation never
    # above what is on hand, a sale price never above the struck-through one —
    # are CHECK constraints in PostgreSQL DDL, so the suite needs the real
    # database rather than SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vikyplus
          POSTGRES_PASSWORD: vikyplus
          POSTGRES_DB: vikyplus_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./storefront

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # intl because prices are formatted through ICU; pdo_pgsql for the
          # catalogue. Both are what the app declares in composer.json.
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      # Composer's cache, keyed on the lock file.
      #
      # Not a speed-up — a correctness one. Every dist package comes off
      # codeload.github.com, and an anonymous run downloading two hundred of
      # them gets rate-limited: run #383 died on `symfony/uid` with an
      # HTTP 429, before a single test body ran, and because the deploy needs
      # this job it took a finished fix off the road to the site with it.
      # Nothing about the change was wrong and nothing about the failure said
      # so.
      #
      # A hit restores vendor/ from the runner's own cache and asks GitHub for
      # nothing. A miss still downloads, but with `COMPOSER_AUTH` below it does
      # so as this repository rather than as an anonymous stranger sharing one
      # allowance with the whole runner fleet.
      - name: Cache Composer's downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('storefront/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        env:
          # The workflow's own token, which every run already has. It only
          # raises the download allowance; `permissions: contents: read` at the
          # top of this file is what it can actually do.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: vikyplus
        run: php artisan test

      - name: Check the code style
        run: ./vendor/bin/pint --test

  probe:
    name: What the live site sends
    runs-on: ubuntu-latest
    # Never blocks anything. It reports on the site that is already up; it has
    # no opinion about the commit being pushed, and a site that is mid-deploy
    # or briefly unreachable must not turn a green run red.
    continue-on-error: true
    if: github.event_name != 'pull_request'

    steps:
      # ────────────────────────────────────────────────────────────────────
      # The second opinion this repository has never had.
      #
      # Every weight measurement here has been taken in a development
      # container against `php artisan serve`, because the container's egress
      # proxy answers 403 for both vikyplus.liara.run and vikyplus.ir. So the
      # one number that decides whether any of it matters — **what the server
      # actually puts on the wire** — has been an open question through three
      # rounds of «سایت کنده».
      #
      # 1,047KB of CSS is about 150KB gzipped. If the server compresses, the
      # remaining work is cutting bytes; if it does not, every byte cut here
      # is worth a seventh of what one server setting is worth, and knowing
      # which is the whole of knowing what to do next.
      #
      # A GitHub runner has ordinary internet. It can simply ask.
      #
      # Each file is fetched twice: once refusing compression, which gives the
      # file's real size, and once accepting it, which gives the bytes that
      # crossed. Their ratio is the answer. `time_starttransfer` on the HTML
      # is the server's own thinking time, from a host with a fast line to
      # Europe — so a large number there is the application, not the visitor's
      # connection.
      # ────────────────────────────────────────────────────────────────────
      - name: Ask both hosts what they send
        run: |
          probe_host () {
            host="$1"
            echo "## $host" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # The reply's own description of itself: which server, which
            # protocol, and whether anything is sitting in front of it.
            if ! curl -sS -o /dev/null -D /tmp/head -m 60 "https://$host/"; then
              echo "did not answer." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tr -d '\r' < /tmp/head | grep -Ei '^(HTTP/|server:|via:|x-powered|cf-|x-cache|x-arvan|alt-svc|cache-control|content-encoding|vary)' >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            printf '| file | real | on the wire | encoding | first byte | http |\n' >> "$GITHUB_STEP_SUMMARY"
            printf '| --- | ---: | ---: | --- | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"

            for path in \
              / \
              /assets/css/style.rtl.css \
              /assets/css/tweaks.css \
              /assets/css/bootstrap.rtl.min.css \
              /assets/css/swiper-bundle.rtl.min.css \
              /assets/css/fontawesome.min.css \
              /assets/js/vendor/jquery-3.7.1.min.js \
              /assets/js/main.js \
              /assets/js/swiper-bundle.min.js \
              /assets/js/gsap.min.js \
              /assets/fonts/vazirmatn/Vazirmatn%5Bwght%5D.woff2
            do
              url="https://$host$path"

              # Refusing compression: the file's own size, and the server's
              # thinking time.
              plain="$(curl -sS -o /dev/null -m 60 \
                        -H 'Accept-Encoding: identity' \
                        -w '%{size_download} %{time_starttransfer} %{http_code} %{http_version}' \
                        "$url" || echo '0 0 000 0')"
              set -- $plain
              real="$1"; ttfb="$2"; code="$3"; ver="$4"

              # Accepting it: what a browser is actually sent.
              comp="$(curl -sS -o /dev/null -m 60 -D /tmp/h2 \
                        -H 'Accept-Encoding: gzip, deflate, br' \
                        -w '%{size_download}' \
                        "$url" || echo 0)"
              enc="$(tr -d '\r' < /tmp/h2 | grep -i '^content-encoding:' | head -1 | cut -d' ' -f2- || true)"
              [ -n "$enc" ] || enc='—'

              printf '| `%s` | %s KB | %s KB | %s | %s s | %s (%s) |\n' \
                "$path" \
                "$(awk "BEGIN{printf \"%.0f\", $real/1024}")" \
                "$(awk "BEGIN{printf \"%.0f\", $comp/1024}")" \
                "$enc" "$ttfb" "$code" "$ver" >> "$GITHUB_STEP_SUMMARY"

              # The console copy, so the answer is readable without opening
              # the summary tab.
              printf '%-52s real %8s  wire %8s  %-8s  ttfb %ss  %s h%s\n' \
                "$path" "$real" "$comp" "$enc" "$ttfb" "$code" "$ver"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
          }

          echo "# What the live site sends" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Measured from a GitHub runner, so the timings are the server's, not a visitor's." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          probe_host "${{ vars.LIARA_APP || 'vikyplus' }}.liara.run"
          probe_host "vikyplus.ir"

  deploy:
    name: Deploy to Liara
    runs-on: ubuntu-latest
    needs: tests
    # `main` and nothing else. Never a pull request, and never a working branch
    # — including through the "Run workflow" button, which can be pointed at
    # any ref and would otherwise put that ref's whole tree live.
    #
    # A push to a working branch still reaches the job above it, so the branch
    # gets its tests. It just does not become the site.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # The race the branch rule alone does not close.
      #
      # Two sessions can both bring `main` up and push within a minute of each
      # other. Both runs queue. If the older one reaches this step last it
      # deploys the older tree over the newer one, and the newer session's work
      # disappears from the site exactly as it did on 2026-08-15 — same
      # symptom, different cause, and just as silent.
      #
      # **Only the current tip of `main` may be deployed.** Ancestry is not the
      # test and getting that wrong would leave the hole open: a superseded
      # commit is still an ancestor of the branch that moved past it, so an
      # `--is-ancestor` check would wave it through and let it overwrite the
      # newer site. It has to be the tip, exactly.
      #
      # A superseded run goes red. That is deliberate and it is not noise: red
      # here means "this build did not go live", which is true, and the newer
      # run is meanwhile putting the newer tree up. A green job that quietly
      # deployed nothing is the failure this whole file is trying to stop.
      - name: Refuse to deploy a tree that main has moved past
        run: |
          git fetch --no-tags --depth=1 --quiet origin main
          here="$(git rev-parse HEAD)"
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$here" != "$tip" ]; then
            echo "::error::main has moved on (this run is ${here}, main is now ${tip}). Deploying this tree would put an older site live over a newer one, so nothing was deployed. The run for ${tip} is the one that ships; this failure is expected when two pushes land together."
            exit 1
          fi


      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Liara CLI
        run: npm install -g @liara/cli@9

      - name: Deploy
        working-directory: ./storefront
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        # The app's name in the Liara panel. Set a repository variable named
        # LIARA_APP to use a different one; otherwise it is "vikyplus".
        run: |
          liara deploy \
            --app "${{ vars.LIARA_APP || 'vikyplus' }}" \
            --api-token "$LIARA_TOKEN" \
            --no-app-logs
