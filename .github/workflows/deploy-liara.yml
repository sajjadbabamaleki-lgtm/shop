name: Tests and deploy

# Runs the test suite on every push and every pull request, and deploys to
# Liara only when the tests pass and only from a deploy branch.
#
# The app lives in storefront/, not at the repository root, which is why every
# step below sets working-directory. Liara's own documentation deploys from the
# root; this is the same thing pointed one level down.

on:
  push:
    branches:
      - main
      - claude/wiki-plus-latest-work-enpjl1
      # This round's branch. «تمام تغییراتی که از ۱۵ ساعت پیش مانده و بیلدشون
      # ارسال نشدرو ارسال کن» — a push from a branch that is not on this list
      # deploys nothing, silently, and CLAUDE.md says this file is where that
      # gets fixed. It comes off the list when the branch is merged.
      - claude/shop-section-image-sw2i3a
      # This round: the content pages, the error pages, and «فروش عمده» /
      # «اخذ نمایندگی». Two pushes to this branch deployed nothing at all
      # before it was added here, which is exactly the silent failure the note
      # above describes. It comes off the list when the branch is merged.
      - claude/shoe-store-ui-review-kgk2m9
      # The shop's search box height, its category tiles, and the brand chips
      # crossing the rule as they are tapped. Same reason as the line above:
      # without it this branch's pushes run the tests and deploy nothing, and
      # «بیلد تغییراتو بفرست» would be answered by a build the client cannot see.
      - claude/shop-search-filter-height-qb1nxx
      #
      # ⚠️ **Every branch on this list deploys its own tree to the same Liara
      # app, so two live branches overwrite each other.** «چرا موارد برمیگرده
      # به نسخه قبل؟» — that. This branch and the one above it were both being
      # worked on at once; whichever pushed last was the whole site, and the
      # other one's work vanished from it without either branch losing a
      # commit. The two are merged now, so this tree carries both. Before
      # adding a fourth name here, make sure it is not a *parallel* line of
      # work: the deploy has no merge step, and this file is the only place
      # that fact is written down.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The catalogue's invariants — stock never negative, a reservation never
    # above what is on hand, a sale price never above the struck-through one —
    # are CHECK constraints in PostgreSQL DDL, so the suite needs the real
    # database rather than SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vikyplus
          POSTGRES_PASSWORD: vikyplus
          POSTGRES_DB: vikyplus_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./storefront

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # intl because prices are formatted through ICU; pdo_pgsql for the
          # catalogue. Both are what the app declares in composer.json.
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: vikyplus
        run: php artisan test

      - name: Check the code style
        run: ./vendor/bin/pint --test

  deploy:
    name: Deploy to Liara
    runs-on: ubuntu-latest
    needs: tests
    # Never deploy a pull request — only a push to a deploy branch, or the
    # "Run workflow" button.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Liara CLI
        run: npm install -g @liara/cli@9

      - name: Deploy
        working-directory: ./storefront
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        # The app's name in the Liara panel. Set a repository variable named
        # LIARA_APP to use a different one; otherwise it is "vikyplus".
        run: |
          liara deploy \
            --app "${{ vars.LIARA_APP || 'vikyplus' }}" \
            --api-token "$LIARA_TOKEN" \
            --no-app-logs
