name: Black or navy

# TEMPORARY. Delete once the answer is in hand.
#
# The cut-out's dark body is neutral (mean 28,28,28, b-r = -0.1), which is black
# and not navy. This asks the same question of the shop's two dark On Running
# listings: a navy shoe's dark pixels lean blue, a black one's do not.

on:
  workflow_dispatch:
  push:
    branches: [claude/website-loading-speed-zn0uri]

permissions:
  contents: read

jobs:
  look:
    name: Measure the dark body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 sharp
          npx playwright install --with-deps chromium

      - name: Measure
        run: |
          cat > look.mjs <<'JS'
          import { chromium } from 'playwright';
          import sharp from 'sharp';

          const SLUGS = ['مشکی', 'سرمه-ای', 'طوسی']
            .map((c) => 'کتونی-آن-رانینگ-ON-Running-رنگ-' + c);

          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1400, height: 1200 } });

          for (const slug of SLUGS) {
            await p.goto('https://vikyplus.ir/products/' + encodeURIComponent(slug),
                         { waitUntil: 'load', timeout: 60000 });
            await p.waitForTimeout(2000);
            const src = await p.evaluate(() => {
              const img = document.querySelector('.vp-pdp-shot img, .vp-pdp-gallery img, main img');
              return img ? img.currentSrc : null;
            });
            const buf = Buffer.from(await (await fetch(src)).arrayBuffer());
            const { data, info } = await sharp(buf).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            const ch = info.channels;
            let n = 0, r = 0, g = 0, bl = 0;
            for (let i = 0; i < data.length; i += ch) {
              if (ch === 4 && data[i + 3] < 200) continue;
              const R = data[i], G = data[i + 1], B = data[i + 2];
              if (Math.max(R, G, B) < 110) { n++; r += R; g += G; bl += B; }
            }
            console.log(slug.padEnd(44),
              'darkpx=' + n,
              'mean=' + Math.round(r / n) + ',' + Math.round(g / n) + ',' + Math.round(bl / n),
              'b-r=' + (bl / n - r / n).toFixed(1));
          }

          await b.close();
          JS
          node look.mjs
