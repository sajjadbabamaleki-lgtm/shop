name: Match the tile photographs to the shop's colourways

# TEMPORARY. Delete once the answer is in hand.
#
# «تو باید همون رنگی که تو هوم هست محصول لینک بشه دقیق به همون رنگش» — so which
# colourway each tile shows has to be measured, not read off a name.

on:
  workflow_dispatch:
  push:
    branches: [claude/website-loading-speed-zn0uri]

permissions:
  contents: read

jobs:
  look:
    name: Measure every candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 sharp
          npx playwright install --with-deps chromium

      - name: Measure
        run: |
          cat > look.mjs <<'JS'
          import { chromium } from 'playwright';
          import sharp from 'sharp';

          const V2K = ['سفید-آبی-روشن', 'طوسی-قهوه-ای', 'سفید-صورتی', 'موکا', 'سرمه-ای', 'مشکی']
            .map((c) => 'کتونی-نایک-وی-تو-کی-Nike-V2K-رنگ-' + c);
          const ON = ['مشکی', 'سرمه-ای', 'کرم', 'آبی', 'طوسی', 'صورتی']
            .map((c) => 'کتونی-آن-رانینگ-ON-Running-رنگ-' + c);

          function stats(data, info) {
            const { channels } = info;
            let opaque = 0, blue = 0, pink = 0, brown = 0, dark = 0, light = 0, rS = 0, gS = 0, bS = 0;
            for (let i = 0; i < data.length; i += channels) {
              if (channels === 4 && data[i + 3] < 200) continue;
              const r = data[i], g = data[i + 1], b = data[i + 2];
              opaque++; rS += r; gS += g; bS += b;
              if (b > r + 18 && b > g + 8 && b > 90) blue++;
              if (r > b + 22 && r > g + 10 && r > 140) pink++;
              if (r > b + 18 && g > b + 8 && r > 90 && r < 200) brown++;
              if (r < 70 && g < 70 && b < 70) dark++;
              if (r > 200 && g > 200 && b > 200) light++;
            }
            const pc = (n) => +(100 * n / opaque).toFixed(1);
            return { blue: pc(blue), pink: pc(pink), brown: pc(brown), dark: pc(dark), light: pc(light),
                     mean: [rS, gS, bS].map((v) => Math.round(v / opaque)).join(',') };
          }

          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1400, height: 1200 } });

          for (const slug of [...V2K, ...ON]) {
            try {
              await p.goto('https://vikyplus.ir/products/' + encodeURIComponent(slug),
                           { waitUntil: 'load', timeout: 60000 });
              await p.waitForTimeout(2000);
              const src = await p.evaluate(() => {
                const img = document.querySelector('.vp-pdp-shot img, .vp-pdp-gallery img, main img');
                return img ? img.currentSrc : null;
              });
              if (!src) { console.log(slug.padEnd(52), 'NO IMAGE'); continue; }
              const buf = Buffer.from(await (await fetch(src)).arrayBuffer());
              const { data, info } = await sharp(buf).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
              console.log(slug.padEnd(52), JSON.stringify(stats(data, info)));
            } catch (e) {
              console.log(slug.padEnd(52), 'ERR ' + e.message.slice(0, 80));
            }
          }

          await b.close();
          JS
          node look.mjs
