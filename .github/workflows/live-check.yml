name: What the live front page links to

# TEMPORARY. Delete once the answer is in hand.

on:
  workflow_dispatch:
  push:
    branches: [claude/website-loading-speed-zn0uri]

permissions:
  contents: read

jobs:
  look:
    name: Read every front-page link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install a browser
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Look
        run: |
          cat > look.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1400, height: 1200 } });
          await p.goto('https://vikyplus.ir/', { waitUntil: 'load', timeout: 90000 });
          await p.waitForTimeout(4000);
          await p.evaluate(() => window.scrollTo(0, 4000));
          await p.waitForTimeout(2500);

          const slug = (a) => a ? decodeURIComponent(a.getAttribute('href') || '').split('/products/').pop() : null;

          const out = await p.evaluate(() => {
            const dec = (a) => a ? decodeURIComponent(a.getAttribute('href') || '').split('/products/').pop() : null;
            return {
              hero: [...document.querySelectorAll('.heroSlide6 .swiper-slide')].map((s) => ({
                name: s.querySelector('.hero-title, .vp-hero-title')?.textContent.trim().replace(/\s+/g,' '),
                slug: dec(s.querySelector('a[href*="/products/"]')),
              })),
              best: [...document.querySelectorAll('.vp-best')].map((t) => ({
                name: t.querySelector('.vp-best-name')?.textContent.trim(),
                slug: dec(t.querySelector('a[href*="/products/"]')),
              })),
              ladder: [...document.querySelectorAll('.vp-deal')].map((t) => ({
                name: t.querySelector('.vp-deal-name')?.textContent.trim(),
                slug: dec(t.querySelector('a[href*="/products/"]')),
              })),
              deal: dec(document.querySelector('.vp-daily-deal a[href*="/products/"]')),
              stories: [...document.querySelectorAll('.vp-story')].map((t) => dec(t.querySelector('a[href*="/products/"]'))),
            };
          });
          console.log('RESULT ' + JSON.stringify(out, null, 1));
          await b.close();
          JS
          node look.mjs
