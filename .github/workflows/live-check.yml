name: Does the Torob endpoint work now

# TEMPORARY. Delete once the answer is in hand.
#
# What each answer means:
#   401 + {"error":"X-Torob-Token is missing"}        -> fixed, waiting on Torob
#   404 + {"error":"the product feed is not enabled"} -> TOROB_ENABLED still unset
#   419                                               -> the CSRF fix did not take

on:
  workflow_dispatch:
  push:
    branches: [claude/website-loading-speed-zn0uri]

permissions:
  contents: read

jobs:
  probe:
    name: Ask the endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          for u in \
            "https://vikyplus.ir/torob_api/v3/products" \
            "https://www.vikyplus.ir/torob_api/v3/products" ; do
            echo "=================== POST $u  (no token)"
            curl -sS --max-time 40 -o body.txt -w 'status=%{http_code} type=%{content_type}\n' \
              -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
              --data '{"page": 1, "sort": "date_added_desc"}' "$u" || true
            head -c 300 body.txt; echo

            echo "--- POST with a token that is not Torob's (should be 401, never 419)"
            curl -sS --max-time 40 -o t.txt -w 'status=%{http_code}\n' \
              -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
              -H 'X-Torob-Token: not.a.token' -H 'X-Torob-Token-Version: 1' \
              --data '{"page": 1, "sort": "date_added_desc"}' "$u" || true
            head -c 300 t.txt; echo
          done
