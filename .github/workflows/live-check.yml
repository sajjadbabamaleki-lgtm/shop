name: Find the shop's real On Running

# TEMPORARY. Delete once the answer is in hand.
#
# The proxy here refuses vikyplus.ir, so the live catalogue can only be read
# from a runner. Only the deploy job is gated on `main`, so a working branch
# runs everything and ships nothing.

on:
  workflow_dispatch:
  push:
    branches: [claude/website-loading-speed-zn0uri]

permissions:
  contents: read

jobs:
  look:
    name: Search the live catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install a browser
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Search
        run: |
          cat > look.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1400, height: 1200 } });

          for (const q of ['آن رانینگ', 'اون', 'کلاد', 'on', 'cloud', 'آن']) {
            await p.goto('https://vikyplus.ir/search?q=' + encodeURIComponent(q),
                         { waitUntil: 'load', timeout: 90000 });
            await p.waitForTimeout(2500);
            const rows = await p.evaluate(() => [...document.querySelectorAll('.vp-card')].map((c) => ({
              name: c.querySelector('.vp-card-name')?.textContent.trim(),
              href: c.querySelector('a[href*="/products/"]')?.getAttribute('href'),
              price: c.querySelector('.vp-card-price')?.textContent.replace(/\s+/g, ' ').trim(),
            })));
            console.log('=== ' + q + ' -> ' + rows.length);
            console.log(JSON.stringify(rows, null, 1).slice(0, 4000));
          }

          await b.close();
          JS
          node look.mjs
