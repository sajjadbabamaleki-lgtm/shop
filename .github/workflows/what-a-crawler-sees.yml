name: What a crawler sees

# TEMPORARY, again — this is the verification half. Delete after reading.
# It deploys nothing: the deploy job lives in deploy-liara.yml and is gated
# on main; this workflow has no deploy job at all.

on:
  push:
    branches: [claude/golden-goose-product-url-h3sxhd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    name: Ask the live site as a machine would
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: What a product page now tells a program
        run: |
          set +e
          host=https://vikyplus.ir

          curl -sS --max-time 60 "$host/sitemap.xml" -o /tmp/sitemap.xml
          grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | sed 's/<[^>]*>//g' | grep '/products/' | head -2 > /tmp/two.txt

          while read -r u; do
            [ -n "$u" ] || continue
            curl -sS --max-time 60 -o /tmp/page.html -w "%{http_code}" "$u" > /tmp/code
            echo "======================================================="
            echo "$(cat /tmp/code)  $u"
            echo "title:     $(grep -o '<title>[^<]*</title>' /tmp/page.html | head -1)"
            echo "canonical: $(grep -o '<link rel="canonical"[^>]*>' /tmp/page.html | head -1)"
            echo "og:title:  $(grep -o '<meta property="og:title" content="[^"]*"' /tmp/page.html | head -1)"
            echo "desc:      $(grep -o '<meta name="description" content="[^"]*"' /tmp/page.html | head -1 | cut -c1-200)"
            echo "json-ld:   $(grep -c 'application/ld+json' /tmp/page.html) block(s)"
            echo "--- the structured data itself ---"
            sed -n '/application\/ld+json/,/<\/script>/p' /tmp/page.html | sed '1d;$d' | head -40
          done < /tmp/two.txt

          echo ""
          echo "=== the address ترب keeps asking about ==="
          curl -sS --max-time 60 -o /tmp/gg.html -w 'code %{http_code}  redirect -> %{redirect_url}\n' "$host/products/golden-goose"

          echo ""
          echo "=== and where it lands ==="
          curl -sSL --max-time 60 -o /tmp/land.html -w 'final code %{http_code}\n' "$host/products/golden-goose"
          echo "title:   $(grep -o '<title>[^<]*</title>' /tmp/land.html | head -1)"
          echo "json-ld: $(grep -c 'application/ld+json' /tmp/land.html) block(s)"
          echo "price on page: $(grep -c 'تومان' /tmp/land.html) mentions"
          echo "availability: $(grep -o 'schema.org/[A-Za-z]*Stock\|schema.org/Discontinued' /tmp/land.html | head -1)"
