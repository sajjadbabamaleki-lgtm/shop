name: What a crawler sees

# TEMPORARY. Deleted as soon as it has been read. It deploys nothing — the
# deploy job lives in deploy-liara.yml and is gated on main.

on:
  push:
    branches: [claude/golden-goose-product-url-h3sxhd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    name: Ask the live shop what is on its shelves
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: What the shelves say now
        run: |
          set +e
          host=https://vikyplus.ir

          echo "=== the daily deal's own count, on the home page ==="
          curl -sS --max-time 60 "$host/" -o /tmp/home.html
          grep -o 'فقط [^<]* عدد باقی مانده' /tmp/home.html | head -3

          echo ""
          echo "=== availability, read out of the structured data ==="
          curl -sS --max-time 60 "$host/sitemap.xml" -o /tmp/sitemap.xml
          grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | sed 's/<[^>]*>//g' | grep '/products/' | head -4 > /tmp/four.txt

          while read -r u; do
            [ -n "$u" ] || continue
            curl -sS --max-time 60 -o /tmp/p.html "$u"
            name=$(grep -o '<title>[^<]*</title>' /tmp/p.html | head -1 | sed 's/<[^>]*>//g')
            avail=$(grep -o 'schema.org/InStock\|schema.org/OutOfStock\|schema.org/Discontinued' /tmp/p.html | head -1)
            offers=$(grep -o '"offerCount":[0-9]*' /tmp/p.html | head -1)
            echo "$avail  $offers  $name"
            echo "    sizes offered on the page: $(grep -c 'vp-pick-size' /tmp/p.html)"
            echo "    «ناموجود» on the page:     $(grep -c 'ناموجود' /tmp/p.html)"
          done < /tmp/four.txt
