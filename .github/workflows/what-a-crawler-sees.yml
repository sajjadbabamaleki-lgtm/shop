name: What a crawler sees

# TEMPORARY. Deleted as soon as it has been read. No deploy job.

on:
  push:
    branches: [claude/golden-goose-product-url-h3sxhd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    name: Count what the live shop publishes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - run: |
          set +e
          host=https://vikyplus.ir

          curl -sS --max-time 60 "$host/sitemap.xml" -o /tmp/s.xml
          echo "product URLs in the sitemap: $(grep -o '<loc>[^<]*/products/[^<]*</loc>' /tmp/s.xml | wc -l)"

          echo ""
          echo "=== the two the client photographed ==="
          for slug in ktony-znanh-nayk-mdl-air-force-1-sfyd kfsh; do
            code=$(curl -sS --max-time 60 -o /tmp/p.html -w '%{http_code}' "$host/products/$slug")
            echo "$slug -> $code   $(grep -o '<title>[^<]*</title>' /tmp/p.html | head -1)"
          done
