# Temporary. Asks the live shop for the names of the products the client's
# photographs are of.
#
# The proxy in the working container refuses vikyplus.ir; a runner can reach it,
# and only the deploy job is gated on `main`, so this ships nothing.
#
# Two earlier attempts tried to measure each candidate's colour on the runner
# and both answered 127 — `convert` is gone in ImageMagick 7 and `magick` is not
# installed either. So this prints the names and the picture each one uses, and
# the choosing is done by eye against the files the client sent. `which` is in
# here so the next person does not spend a third run finding out.
#
# Delete this file once the names are read.
name: Find two slugs

on:
  push:
    branches: [claude/website-loading-speed-zn0uri]

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: What this runner has
        run: which magick convert python3 node || true

      - name: The candidates, by name
        run: |
          for q in "نیوبالانس" "تراویس" "گلدن گوس"; do
            echo "==================== $q"
            curl -sS --get --data-urlencode "q=$q" https://vikyplus.ir/search \
              | grep -oE 'class="vp-card-name"[^>]*>[^<]+' \
              | sed 's/.*>//' | sort -u
          done
