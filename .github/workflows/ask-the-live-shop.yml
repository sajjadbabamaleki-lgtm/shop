name: TEMP — ask the live shop about the boot

# ⛔ TEMPORARY. Delete this file once it has answered.
#
# The basket shows «بوت زنانه نیم ساق کشی دو متریال» at ۳٬۹۸۰٬۰۰۰ with no
# warning on the line, and the checkout refuses it with «… در این شعبه فروخته
# نمی‌شود». Read against the code, that refusal has exactly two possible
# causes, and they are two different columns:
#
#     variants.status      != 'active'   — the size itself is retired
#     branch_offers.status != 'active'   — the price row is switched off
#
# They can be told apart from outside the database, because the product page's
# size chips are built by `Sellers::forMany()`, which asks the offer's status
# and **not** the variant's:
#
#     size ۴ still has a radio chip  → the offer is active → variants.status
#     size ۴ is drawn as `is-off`    → branch_offers.status
#
# Nothing in this container can reach an Iranian host — the proxy answers 403
# for vikyplus.ir — and a GitHub runner can (CLAUDE.md, measured 19–20 Sept).
# Only the deploy job is gated on `main`, so this runs and ships nothing.

on:
  push:
    branches: [claude/bot-shop-error-wxric8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ask:
    name: What the live shop says about that boot
    runs-on: ubuntu-latest
    steps:
      - name: Read the boot's page
        run: |
          python3 - <<'PY'
          import gzip, re, sys, urllib.parse, urllib.request

          BASE = "https://vikyplus.ir"

          def get(url, timeout=60):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (probe; vikyplus repository)",
                  "Accept-Encoding": "gzip",
              })
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw = r.read()
                  if r.headers.get("Content-Encoding") == "gzip":
                      raw = gzip.decompress(raw)
                  return r.status, raw.decode("utf-8", "replace")

          def chips(html):
              """Every size chip, in the state the page drew it in."""
              out = []
              for tag, extra, body in re.findall(
                      r'<(label|a|span) class="vp-pick-size([^"]*)"(.*?)</\1>', html, re.S):
                  eu = re.search(r'vp-size-eu">([^<]*)<', body)
                  radio = re.search(r'name="variant" value="(\d+)"', body)
                  out.append((
                      (eu.group(1).strip() if eu else "?"),
                      ("قابل انتخاب — radio " + radio.group(1)) if radio else
                      ("is-off — no such size here" if "is-off" in extra else
                       "is-elsewhere — another seller" if "is-elsewhere" in extra
                       else tag + extra),
                  ))
              return out

          status, sitemap = get(f"{BASE}/sitemap.xml")
          locs = re.findall(r"<loc>([^<]+/products/[^<]+)</loc>", sitemap)
          print(f"sitemap: http {status}, {len(locs)} product URLs\n")

          print("=== every slug the sitemap lists ===")
          for u in sorted(locs):
              print("   ", urllib.parse.unquote(u).rsplit("/products/", 1)[-1])

          print("\n=== the shop's own search, for the words in the photograph ===")
          found = []
          for q in ("بوت", "نیم ساق", "دو متریال", "بوت زنانه"):
              try:
                  status, html = get(f"{BASE}/search?" + urllib.parse.urlencode({"q": q}))
              except Exception as e:
                  print(f"  {q!r}: unreachable — {e}"); continue
              hits = sorted(set(re.findall(r'href="([^"]*/products/[^"?#]+)"', html)))
              count = re.search(r"([۰-۹\d,]+)\s*کالا", html)
              print(f"  {q!r}: http {status}, «{count.group(1) if count else '?'} کالا», "
                    f"{len(hits)} links")
              for h in hits:
                  print("       ", urllib.parse.unquote(h))
              found += hits

          print("\n=== and what each of those pages says ===")
          for url in sorted(set(found)):
              if url.startswith("/"):
                  url = BASE + url
              try:
                  status, html = get(url)
              except Exception as e:
                  print("  unreachable:", e); continue
              title = re.search(r"<title>([^<]*)</title>", html)
              print("\n" + "=" * 70)
              print(" ", urllib.parse.unquote(url))
              print(f"  http {status}   <title> {title.group(1).strip() if title else '—'}")
              cs = chips(html)
              print(f"  {len(cs)} size chips:")
              for digits, state in cs:
                  print(f"      {digits:>4}   {state}")
              print("  «فعلاً موجود نیست»:", "vp-pdp-out" in html)
              print("  hidden single-size input:",
                    re.findall(r'<input type="hidden" name="variant" value="(\d+)">', html))
              for key in ("price", "availability"):
                  for m in set(re.findall(r'"%s"\s*:\s*("[^"]*"|\d+)' % key, html)):
                      print(f"  JSON-LD {key}: {m}")
          PY
