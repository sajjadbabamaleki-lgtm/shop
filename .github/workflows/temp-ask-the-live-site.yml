name: TEMP ask the live site

on: push

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Why on-cloudtilt and golden-goose are refused
        run: |
          set -u
          host=https://vikyplus.ir
          curl -s --max-time 120 "$host/sitemap.xml" -o /tmp/sm || true
          grep -oE '<loc>[^<]*/products/[^<]*</loc>' /tmp/sm | sed -e 's~<loc>~~' -e 's~</loc>~~' -e 's~^.*/products/~~' | sort -u > /tmp/raw
          echo "total products: $(wc -l < /tmp/raw)"
          printf '%b\n' "$(sed -e 's/+/ /g' -e 's/%/\\x/g' /tmp/raw)" > /tmp/dec
          paste -d'\t' /tmp/raw /tmp/dec > /tmp/pairs
          echo
          echo "=== GOLDEN GOOSE: slug -> title ==="
          grep -iP 'گلدن|golden' /tmp/pairs | while IFS=$'\t' read -r enc dec; do
            t="$(curl -s --max-time 30 "$host/products/$enc" | grep -o '<title>[^<]*' | head -1 | cut -c8- | sed 's/ — VikyPlus//')"
            printf '  %-60s |%s|\n' "$dec" "$t"
          done
          echo
          echo "=== ON RUNNING: slug -> title ==="
          grep -iP 'رانینگ|ON-Running' /tmp/pairs | while IFS=$'\t' read -r enc dec; do
            t="$(curl -s --max-time 30 "$host/products/$enc" | grep -o '<title>[^<]*' | head -1 | cut -c8- | sed 's/ — VikyPlus//')"
            printf '  %-60s |%s|\n' "$dec" "$t"
          done
          echo
          echo "=== does any other slug carry the word 'on' or 'cloudtilt'? ==="
          grep -icP '(^|-)on(-|$)|cloudtilt|کلادتیلت' /tmp/dec
