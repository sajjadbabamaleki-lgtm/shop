name: TEMP ask the live site

on: push

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Every product slug the live shop publishes
        run: |
          set -u
          host=https://vikyplus.ir
          curl -s --max-time 120 "$host/sitemap.xml" -o /tmp/sm || true
          echo "sitemap bytes: $(wc -c < /tmp/sm)"
          grep -oE '<loc>[^<]*/products/[^<]*</loc>' /tmp/sm | sed -e 's~<loc>~~' -e 's~</loc>~~' -e 's~^.*/products/~~' > /tmp/slugs
          echo "slugs: $(wc -l < /tmp/slugs)"
          printf '%b\n' "$(sed -e 's/+/ /g' -e 's/%/\\x/g' /tmp/slugs)"
