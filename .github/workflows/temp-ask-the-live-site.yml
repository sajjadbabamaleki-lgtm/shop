name: TEMP ask the live site

on: push

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Do the old addresses open the shoe now
        run: |
          set -u
          ask() {
            code=$(curl -s -o /tmp/h -D /tmp/d -w '%{http_code}' --max-time 45 "https://vikyplus.ir$1" || echo ERR)
            loc=$(grep -i '^location:' /tmp/d | tr -d '\r' | cut -c11- | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))' 2>/dev/null)
            printf '%s  %-22s %s\n' "$code" "$2" "$loc"
          }
          ask '/product/%DA%A9%D9%81%D8%B4/%DA%A9%D8%AA%D9%88%D9%86%DB%8C-%D9%86%D8%A7%DB%8C%DA%A9-%D9%85%D8%AF%D9%84-%D9%88%D9%88%D9%85%D8%B1%D9%88-%DB%B5-%D8%B1%D9%86%DA%AF-%D9%82%D9%87%D9%88%D9%87-%D8%A7%DB%8C-nike-vomero-5' 'vomero brown'
          ask '/product/%DA%A9%D9%81%D8%B4/%DA%A9%D8%AA%D9%88%D9%86%DB%8C-%D9%86%D8%A7%DB%8C%DA%A9-%D9%85%D8%AF%D9%84-%D9%88%D9%88%D9%85%D8%B1%D9%88-%DB%B5-%D8%B1%D9%86%DA%AF-%D9%85%D8%B4%DA%A9%DB%8C-nike-vomero-5' 'vomero black'
          ask '/product/%DA%A9%D9%81%D8%B4/%DA%A9%D8%AA%D9%88%D9%86%DB%8C-%D9%86%D8%A7%DB%8C%DA%A9-%D9%85%D8%AF%D9%84-%D8%AC%D8%B1%D8%AF%D9%86-%D9%88%D8%A7%D9%86-%D8%B3%D8%A7%D9%82-%DA%A9%D9%88%D8%AA%D8%A7%D9%87-%D8%B1%D9%86%DA%AF-%D8%B3%D9%81%DB%8C%D8%AF-air-jor' 'jordan white cut'
          ask '/product/%DA%A9%D9%81%D8%B4/%D9%88%D9%86%D8%B3-%D8%A2%D8%AF%DB%8C%D8%AF%D8%A7%D8%B3-%D9%85%D8%AF%D9%84-%D8%B3%D8%A7%D9%85%D8%A8%D8%A7-%D8%B1%D9%86%DA%AF-%D9%82%D9%87%D9%88%D9%87-%D8%A7%DB%8C-adidas-samba' 'samba brown'
          ask '/products/%DA%A9%D8%AA%D9%88%D9%86%DB%8C-%D9%86%D8%A7%DB%8C%DA%A9-%D9%85%D8%AF%D9%84-%D9%88%D9%88%D9%85%D8%B1%D9%88-%DB%B5-%D8%B1%D9%86%DA%AF-%D9%82%D9%87%D9%88%D9%87-%D8%A7%DB%8C-nike-vomero-5' 'old slug, new path'
          ask '/products/golden-goose' 'golden-goose'
          ask '/products/jordan-one-air' 'jordan-one-air (must 200)'
