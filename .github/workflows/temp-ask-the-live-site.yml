# TEMPORARY. Delete once read.
#
# ترب holds addresses of the shape /product/<category>/<slug> — the previous
# website's scheme — and reports 38 products «خارج از دسترس». This asks the
# live site what those addresses actually answer, and what slug the shop really
# uses for the one product ترب named. Nothing here ships: only the deploy job
# is gated on main, so a push to a working branch runs and deploys nothing.
name: TEMP ask the live site

on:
  push:
    branches:
      - claude/torob-api-v3-implementation-7yuc5p
  workflow_dispatch:

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: What the old and new addresses answer
        run: |
          set -u
          host=https://vikyplus.ir
          slug_fa='کتونی-نایک-مدل-وومرو-۵-رنگ-قهوه-ای'

          ask() {
            code="$(curl -s -o /tmp/body -w '%{http_code}' -L --max-time 40 "$1" || echo 000)"
            size="$(wc -c < /tmp/body)"
            printf '%s  %6s bytes  %s\n' "$code" "$size" "$2"
          }

          echo "== the address ترب holds, and the shapes it could map to =="
          ask "$host/product/%DA%A9%D9%81%D8%B4/$(printf %s "$slug_fa" | jq -sRr @uri)-nike-vomero-5" "OLD scheme /product/کفش/<slug>-nike-vomero-5"
          ask "$host/products/$(printf %s "$slug_fa" | jq -sRr @uri)-nike-vomero-5"               "/products/<slug>-nike-vomero-5   (lowercase latin)"
          ask "$host/products/$(printf %s "$slug_fa" | jq -sRr @uri)-Nike-Vomero-5"               "/products/<slug>-Nike-Vomero-5   (capitalised)"
          ask "$host/products/golden-goose"                                                       "/products/golden-goose (known good)"

          echo
          echo "== what slug the shop really uses: search the live site for vomero =="
          curl -s --max-time 40 "$host/search?q=vomero" -o /tmp/search || true
          echo "search page: $(wc -c < /tmp/search) bytes"
          grep -oE '/products/[^"?#]+' /tmp/search | sort -u | head -20 || echo "no /products/ links found"

          echo
          echo "== and what the listing shows for نایک =="
          curl -s --max-time 40 "$host/products?brand=nike" -o /tmp/nike || true
          grep -oE '/products/[^"?#]+' /tmp/nike | sort -u | head -30 || echo "none"
