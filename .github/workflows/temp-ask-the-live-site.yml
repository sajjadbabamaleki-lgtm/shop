name: TEMP ask the live site

on: push

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Every product slug the live shop publishes
        run: |
          set -u
          host=https://vikyplus.ir
          curl -s --max-time 120 "$host/sitemap.xml" -o /tmp/sm || true
          echo "sitemap bytes: $(wc -c < /tmp/sm)"
          grep -oE '<loc>[^<]*/products/[^<]*</loc>' /tmp/sm \
            | sed -e 's~<loc>~~' -e 's~</loc>~~' \
            | sed -e 's~^.*/products/~~' \
            | python3 -c 'import sys,urllib.parse
for line in sys.stdin:
    print(urllib.parse.unquote(line.strip()))'
