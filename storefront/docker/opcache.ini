; The code in the image never changes while the container runs, so opcache is
; told not to go looking. validate_timestamps=0 is the setting that makes the
; difference; the rest is headroom for Laravel's file count.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
