<!--
  Hero — three cards on one axis.

  Each card is a photograph with its own caption beneath it, not a bare image:
  category, product name, and starting price. The front card is sharp; the two
  behind sit back, blurred, and run past both edges of the viewport.

  Card order is presentational only. The DOM order is the reading order and
  position is assigned by script, so without CSS or JS this is three captioned
  product links in sequence.
-->
<section class="vp-hero" aria-label="کالکشن فصل جدید">
  <div class="vp-deck" data-deck>
    <ul class="vp-deck__track">

      <li class="vp-deck__card">
        <a href="product/leather-derby.html">
          <span class="vp-deck__media">
            <img src="assets/img/collection/collection_2_1.png" alt="کفش چرم قهوه‌ای مردانه" width="800" height="600" fetchpriority="high" decoding="async">
          </span>
          <span class="vp-deck__caption">
            <span class="vp-deck__text">
              <span class="vp-deck__kicker">کفش مردانه</span>
              <span class="vp-deck__name">چرم دستدوز قهوه‌ای</span>
            </span>
            <span class="vp-deck__price">از ۳٬۲۰۰٬۰۰۰ تومان</span>
          </span>
        </a>
      </li>

      <li class="vp-deck__card">
        <a href="product/running-sneaker.html">
          <span class="vp-deck__media">
            <img src="assets/img/collection/collection_2_3.png" alt="کتونی رانینگ رنگی" width="800" height="600" fetchpriority="high" decoding="async">
          </span>
          <span class="vp-deck__caption">
            <span class="vp-deck__text">
              <span class="vp-deck__kicker">کتونی رانینگ</span>
              <span class="vp-deck__name">ایر ری‌اکت نئون</span>
            </span>
            <span class="vp-deck__price">از ۴٬۸۵۰٬۰۰۰ تومان</span>
          </span>
        </a>
      </li>

      <li class="vp-deck__card">
        <a href="product/gold-sneaker.html">
          <span class="vp-deck__media">
            <img src="assets/img/collection/collection_2_2.png" alt="کتونی طلایی و سفید زنانه" width="800" height="600" fetchpriority="high" decoding="async">
          </span>
          <span class="vp-deck__caption">
            <span class="vp-deck__text">
              <span class="vp-deck__kicker">کتونی زنانه</span>
              <span class="vp-deck__name">متالیک طلایی</span>
            </span>
            <span class="vp-deck__price">از ۵٬۹۰۰٬۰۰۰ تومان</span>
          </span>
        </a>
      </li>

    </ul>

    <div class="vp-deck__controls">
      <button type="button" class="vp-deck__nav" data-deck-prev aria-label="تصویر قبلی">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
          <path d="M10 2.5 4.5 8l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="vp-deck__dots" role="tablist" aria-label="انتخاب تصویر"></div>
      <button type="button" class="vp-deck__nav" data-deck-next aria-label="تصویر بعدی">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
          <path d="M6 2.5 11.5 8 6 13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</section>
