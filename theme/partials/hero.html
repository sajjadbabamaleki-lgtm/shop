<!--
  Hero — a layered deck of five photographs, and nothing else.

  Five cards on one axis: the front card whole, one on each side sitting back
  with about a third of its width tucked under the front one, and one further
  back again on each side. The deck advances sideways — the front card moves
  off and its neighbour rises into its place.

  Card order is presentational only. The DOM order is the reading order and
  position is assigned by script, so without CSS or JS this is five captioned
  images in sequence.
-->
<section class="vp-hero" aria-label="کالکشن فصل جدید">
  <div class="vp-deck" data-deck>
    <ul class="vp-deck__track">
      <li class="vp-deck__card">
        <a href="product/leather-derby.html">
          <img src="assets/img/collection/collection_2_1.png" alt="کفش چرم قهوه‌ای" width="600" height="700" fetchpriority="high" decoding="async">
        </a>
      </li>
      <li class="vp-deck__card">
        <a href="product/gold-sneaker.html">
          <img src="assets/img/collection/collection_2_2.png" alt="کتونی طلایی و سفید" width="600" height="700" fetchpriority="high" decoding="async">
        </a>
      </li>
      <li class="vp-deck__card">
        <a href="product/running-sneaker.html">
          <img src="assets/img/collection/collection_2_3.png" alt="کتونی رانینگ رنگی" width="600" height="700" fetchpriority="high" decoding="async">
        </a>
      </li>
      <li class="vp-deck__card">
        <a href="product/sport-sneaker.html">
          <img src="assets/img/collection/collection_3_1.jpg" alt="کتونی اسپرت" width="600" height="700" loading="lazy" decoding="async">
        </a>
      </li>
      <li class="vp-deck__card">
        <a href="product/floral-heel.html">
          <img src="assets/img/collection/collection_1_1.png" alt="کفش پاشنه‌دار گلدار" width="600" height="700" loading="lazy" decoding="async">
        </a>
      </li>
    </ul>

    <div class="vp-deck__controls">
      <button type="button" class="vp-deck__nav" data-deck-prev aria-label="تصویر قبلی">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
          <path d="M10 2.5 4.5 8l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="vp-deck__dots" role="tablist" aria-label="انتخاب تصویر"></div>
      <button type="button" class="vp-deck__nav" data-deck-next aria-label="تصویر بعدی">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
          <path d="M6 2.5 11.5 8 6 13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</section>
