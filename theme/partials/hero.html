<!--
  Replacement hero.

  The stock hero is a rounded pastel card floating inside a carousel, with the
  neighbouring slides peeking in from both edges, a 50/50 text-left /
  image-right split, a colour block behind the headline, and a rotating
  discount badge. Every one of those is a signature, and the carousel is also
  the wrong shape for the brief: the specification asks for one hero with one
  message, one image and one action.

  So this is a single hero, not a slider:
    - full-bleed, no card and no rounding, so nothing floats on a tinted panel
    - asymmetric — the image runs past the container edge and the copy overlaps
      it, instead of two centred halves meeting in the middle
    - the shape block, the peeking slides and the rotating badge are gone
    - one line of copy, one price cue, one call to action

  Removing the carousel also fixes the LCP image: a single eager image with an
  explicit aspect ratio beats a lazy-initialised Swiper slide.
-->
<section class="vp-hero">
  <div class="vp-hero__media">
    <img src="assets/img/hero/hero_6_1.png" alt="کتونی نایک ایر، رنگ موکا روشن" width="626" height="600" fetchpriority="high" decoding="async">
  </div>

  <div class="vp-hero__copy">
    <p class="vp-hero__eyebrow">کالکشن پاییز</p>
    <h1 class="vp-hero__title">کتونی نایک ایر<br>موکا روشن</h1>
    <p class="vp-hero__meta">از ۴٬۸۵۰٬۰۰۰ تومان · سایز ۳۹ تا ۴۵</p>
    <a class="vp-hero__cta" href="product/nike-v2k.html">
      مشاهده محصول
      <svg viewBox="0 0 22 12" width="22" height="12" fill="none" aria-hidden="true">
        <path d="M21 6H1M7 1 1.6 6 7 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</section>
