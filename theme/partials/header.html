<!--
  Replacement header.

  The stock header stacks three bands (dark utility strip, then a symmetric
  logo / centred-nav / actions row, then mega-menu panels). That stack is the
  arrangement every marketplace shop theme ships, so restyling it does not help
  — the structure itself is the tell.

  Three structural changes:
    1. One band, not three. Phone, email, currency and language move out; a
       Persian shop selling in Toman has no use for a currency switcher.
    2. Start-anchored, not symmetric. Logo and navigation sit together at the
       start of the line and the actions close it, instead of the
       logo-left / nav-centre / icons-right split.
    3. The navigation lists real categories. "Home / Shop / Pages / Blog /
       Contact" is the arrangement of a theme demo, not of a shop; these are
       the categories from the specification's own navigation list, and the
       menu should only ever expose ones that hold sellable stock.
-->
<header class="vp-header" id="vp-header">
  <div class="vp-header__inner">

    <a class="vp-header__logo" href="index.html" aria-label="ویکی‌پلاس، صفحه اصلی">
      <span class="vp-header__mark" aria-hidden="true"></span>
      <span class="vp-header__name">ویکی‌پلاس</span>
    </a>

    <nav class="vp-nav" aria-label="دسته‌بندی‌ها">
      <ul>
        <li><a href="category-sneakers.html">کتونی</a></li>
        <li><a href="category-shoes.html">کفش</a></li>
        <li><a href="category-bags.html">کیف</a></li>
        <li><a href="category-accessories.html">اکسسوری</a></li>
        <li><a href="collection-new.html">جدیدها</a></li>
        <li><a href="collection-sale.html" class="is-accent">حراج</a></li>
      </ul>
    </nav>

    <div class="vp-header__actions">
      <form class="vp-search" role="search" action="search-product.html">
        <label class="vp-visually-hidden" for="vp-q">جستجو</label>
        <input id="vp-q" name="q" type="search" placeholder="نام محصول یا برند" autocomplete="off">
        <button type="submit" aria-label="جستجو">
          <svg viewBox="0 0 20 20" width="17" height="17" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="6.25" stroke="currentColor" stroke-width="1.6"/>
            <path d="M13.6 13.6 17.5 17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <a class="vp-icon-btn" href="my-account.html" aria-label="حساب کاربری">
        <svg viewBox="0 0 20 20" width="19" height="19" fill="none" aria-hidden="true">
          <circle cx="10" cy="6.75" r="3.25" stroke="currentColor" stroke-width="1.5"/>
          <path d="M3.75 17c.6-3.4 3.1-5.25 6.25-5.25S15.65 13.6 16.25 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </a>

      <a class="vp-icon-btn vp-cart" href="cart.html" aria-label="سبد خرید، ۲ کالا">
        <svg viewBox="0 0 20 20" width="19" height="19" fill="none" aria-hidden="true">
          <path d="M3.5 5.75h13l-1.1 8.2a1.6 1.6 0 0 1-1.6 1.4H6.2a1.6 1.6 0 0 1-1.6-1.4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M7.25 5.75a2.75 2.75 0 0 1 5.5 0" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="vp-cart__count">۲</span>
      </a>

      <button class="vp-icon-btn vp-burger" type="button" aria-label="منو" aria-expanded="false">
        <svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true">
          <path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

  </div>
</header>
