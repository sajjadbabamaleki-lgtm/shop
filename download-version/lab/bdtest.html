<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<!-- Live DOM behind, not an image: can backdrop-filter resolve an feImage
     displacement map the way a filter inside an <svg> can? -->
<div style="position:relative;width:740px;height:328px;background:#1E6FE0">
  <div style="position:absolute;left:60px;top:-40px;width:70px;height:420px;background:#C22B3F;transform:rotate(14deg)"></div>
  <div style="position:absolute;left:320px;top:-40px;width:90px;height:420px;background:#E0637A;transform:rotate(-10deg)"></div>
  <div style="position:absolute;left:560px;top:-40px;width:60px;height:420px;background:#8E1526;transform:rotate(8deg)"></div>
  <div id="glass" style="position:absolute;left:90px;top:90px;width:560px;height:148px;border-radius:74px;
       backdrop-filter:url(#f); -webkit-backdrop-filter:url(#f); background:rgba(255,255,255,.10)"></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <filter id="f" x="0" y="0" width="560" height="148" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feImage href="map-in.png" x="0" y="0" width="560" height="148" result="map" preserveAspectRatio="none"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="90" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
</body>
